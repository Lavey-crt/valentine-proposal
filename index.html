<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💖</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff4ecd, #6c63ff);
      color: white;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .buttons {
      margin-top: 30px;
    }

    button {
      padding: 16px 36px;
      font-size: 20px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 10px;
    }

    #yesBtn {
      background: #00ffab;
      color: #000;
      font-weight: bold;
    }

    #noBtn {
      background: #ff3b3b;
      color: white;
      position: absolute;
    }

    #memeGif, #finalGif {
      display: none;
      margin-top: 20px;
    }

    img {
      border-radius: 20px;
      width: 260px;
    }
  </style>
</head>
<body>

  <h1>Be my Valentine? 💘</h1>
  <p>You only have one correct option 😌</p>

  <div class="buttons">
    <button id="yesBtn">YES 😍</button>
    <button id="noBtn">NO 🙄</button>
  </div>

  <div id="memeGif">
    <img id="dogGif" src="">
    <p>Bro… really? 🐶💀</p>
  </div>

  <div id="finalGif">
    <img src="https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif">
    <h2>LET’S GOOO 💖✨</h2>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const memeGif = document.getElementById("memeGif");
    const dogGif = document.getElementById("dogGif");
    const finalGif = document.getElementById("finalGif");

    let yesSize = 20;
    let memeIndex = 0;

    const dogMemes = [
      "https://media.giphy.com/media/VbnUQpnihPSIgIXuZv/giphy.gif",
      "https://media.giphy.com/media/3o7aD2saalBwwftBIY/giphy.gif",
      "https://media.giphy.com/media/l41lVsYDBC0UVQJCE/giphy.gif",
      "https://media.giphy.com/media/9rtpurjbqiqZXbBBet/giphy.gif"
    ];

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 60);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    noBtn.addEventListener("click", () => {
      memeGif.style.display = "block";
      dogGif.src = dogMemes[memeIndex % dogMemes.length];
      memeIndex++;

      yesSize += 8;
      yesBtn.style.fontSize = yesSize + "px";
      yesBtn.style.padding = (yesSize / 2) + "px " + (yesSize) + "px";
    });

    yesBtn.addEventListener("click", () => {
      finalGif.style.display = "block";
      memeGif.style.display = "none";
      noBtn.style.display = "none";
    });
  </script>

</body>
</html>
